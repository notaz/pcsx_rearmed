name: CI (Linux armhf)
on: [push, pull_request]
jobs:
  build-linux-armhf:
    runs-on: ubuntu-latest
    # use Debian due to ubuntu's need of ports.ubuntu.com for armhf,
    # occasionally failing because of deb version mismatch vs main repo
    container: debian:trixie
    steps:
    - name: Debian specifics before checkout
      run: |
        whoami
        apt-get update
        apt-get install -y sudo git ca-certificates
    - uses: actions/checkout@v5
      with:
        submodules: true
        fetch-depth: 2
    - name: Enable armhf architecture and apt update
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
    - name: Install dependencies
      run: |
        sudo apt-get install -y make gcc libz-dev \
          libsdl1.2-dev:armhf libasound2-dev:armhf libpng-dev:armhf libz-dev:armhf \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user \
          clang binutils-mipsel-linux-gnu
    - name: configure
      run: DUMP_CONFIG_LOG=1 CROSS_COMPILE=arm-linux-gnueabihf- ./configure
    - name: make
      run: |
        make -j$(getconf _NPROCESSORS_ONLN)
        make -C tools/
        make -C tests/
    - name: tests
      run: QEMU=qemu-armhf make -C tests/ run
